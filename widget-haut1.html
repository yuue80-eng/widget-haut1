<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Widget haut – Life Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Great+Vibes&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#efe6d8; --card:#f4ede1; --line:#d9ccb8; --ink:#3b0f14; --bordeaux:#4a0e16; --soft:#7a5a55;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  [hidden]{display:none!important}
  html,body{background:transparent;font-family:'Cormorant Garamond',Georgia,serif;color:var(--ink)}
  body{padding:0}
  .row{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1.1fr) minmax(0,1.6fr) minmax(0,1.45fr) minmax(0,.85fr);gap:6px;align-items:stretch;height:112px;box-sizing:border-box;padding:4px;background:var(--bg);border-radius:10px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px clamp(8px,1.2vw,14px);
        box-shadow:0 1px 0 #fff8 inset,0 2px 6px #4a0e1614;min-height:0;min-width:0;overflow:hidden;position:relative;display:flex;flex-direction:column;justify-content:center}
  .t{font-weight:600;font-size:clamp(13px,1.6vw,16px);letter-spacing:.2px}
  .script{font-family:'Great Vibes','Brush Script MT',cursive;font-size:clamp(16px,1.8vw,22px);color:var(--bordeaux);line-height:1.1;margin-top:2px;white-space:normal}
  .script i{font-style:normal;font-family:Georgia,serif;font-size:20px}
  /* date */
  .date{display:flex;align-items:center;gap:8px}
  .ico{width:22px;height:22px;flex:none;stroke:var(--bordeaux);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
  .datebtn{position:relative;cursor:pointer;border-bottom:1px dotted var(--soft);padding-bottom:1px}
  .datebtn input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:16px}
  .today{position:absolute;top:5px;right:8px;margin:0;background:none;border:1px solid var(--line);border-radius:999px;color:var(--soft);font:600 12px 'Cormorant Garamond',serif;padding:0 7px;cursor:pointer}
  .date{flex-wrap:wrap}

  /* météo */
  .meteo{flex-direction:row;align-items:center;gap:6px}
  .meteo .emoji{flex:none}.mtxt{overflow:hidden}.meteo .ville{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}.meteo .cond{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .meteo .big{font-size:clamp(28px,3.4vw,40px);font-weight:500;line-height:1}
  .meteo .ville{font:600 16px 'Cormorant Garamond',serif;color:inherit;background:none;border:0;border-bottom:1px dotted var(--soft);cursor:pointer;padding:0}
  .mtxt{min-width:0}
  #vform{display:flex;gap:4px;margin:2px 0}
  #vform input{width:100%;min-width:0;border:1px solid var(--line);background:#fffaf0;border-radius:6px;padding:2px 6px;font:15px 'Cormorant Garamond',serif;color:var(--ink)}
  #vform button{background:var(--bordeaux);color:#f4ede1;border:0;border-radius:6px;padding:2px 8px;cursor:pointer;font:600 13px 'Cormorant Garamond',serif}
  .meteo .cond{font-size:13px;line-height:1.2;color:var(--soft)}
  .meteo .emoji{font-size:clamp(28px,3.6vw,40px);filter:saturate(.35) sepia(.4)}
  /* humeur */
  .humeur h3{font-size:14px;font-weight:600;margin-bottom:4px;display:flex;align-items:center;gap:6px}
  .faces{display:flex;justify-content:space-between;gap:0}
  .face{min-width:0;background:none;border:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;
        font:inherit;color:inherit;padding:2px 1px;border-radius:8px;transition:transform .15s}
  .face:hover{transform:translateY(-2px)}
  .face svg{width:clamp(22px,2.6vw,30px);height:clamp(22px,2.6vw,30px);stroke:var(--bordeaux);fill:none;stroke-width:1.4;stroke-linecap:round;transition:all .2s}
  .face span{font-size:clamp(8px,.95vw,12px);letter-spacing:-.2px}
  .face.on svg{fill:var(--bordeaux);stroke:var(--bordeaux)}
  .face.on svg .m,.face.on svg .e{stroke:#f4ede1;fill:#f4ede1}
  .face.on span{font-weight:600}
  /* spotify */
  .spot{flex-direction:row;align-items:center;gap:8px;padding:6px 8px}
  .logo{width:34px;height:34px;border-radius:50%;background:var(--bordeaux);display:grid;place-items:center;flex:none}
  .logo svg{width:26px;height:26px;stroke:#f4ede1;fill:none;stroke-width:2;stroke-linecap:round}
  .spot .txt{flex:1;min-width:0}
  .spot .txt .t{font-size:16px}
  .spot .txt .sub{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
  .spot form{display:flex;gap:6px;margin-top:6px}
  .spot input{flex:1;min-width:0;width:0;border:1px solid var(--line);background:#fffaf0;border-radius:6px;padding:4px 8px;
              font:14px 'Cormorant Garamond',serif;color:var(--ink)}
  .spot button{background:var(--bordeaux);color:#f4ede1;border:0;border-radius:6px;padding:4px 10px;cursor:pointer;font:600 14px 'Cormorant Garamond',serif}
  .player{width:100%;border:0;border-radius:10px;height:84px;display:block}
  .spot.has{padding:4px;display:block;overflow:hidden}
  .spot .chg{position:absolute;right:8px;bottom:2px;background:#f4ede1cc;border:0;color:var(--soft);font-size:11px;cursor:pointer;text-decoration:underline;border-radius:4px;padding:0 4px}
  @media (max-width:640px){.row{grid-template-columns:1.3fr 1.15fr 1.55fr 1.45fr}.photo{display:none}}
  @media (max-width:480px){.row{grid-template-columns:1fr 1fr;height:auto}.card{min-height:96px}}
  @media (max-width:360px){.row{grid-template-columns:1fr}}
</style>

<body>
<div class="row">

  <!-- DATE -->
  <section class="card">
    <div class="date">
      <svg class="ico" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>
      <label class="t datebtn" for="dpick" title="Changer la date"><span id="date">…</span>
        <input type="date" id="dpick" aria-label="Choisir une date"></label>
      <button class="today" id="today" type="button" title="Revenir à aujourd'hui" hidden>aujourd'hui</button>
    </div>
    <div class="script">Tout est possible <i>♡</i></div>
  </section>

  <!-- MÉTÉO -->
  <section class="card meteo">
    <div class="emoji" id="mEmoji">🌤️</div>
    <div class="big" id="mTemp">–°</div>
    <div class="mtxt">
      <button class="ville" id="ville" type="button" title="Changer de ville">Toulouse</button>
      <form id="vform" hidden><input id="vin" placeholder="Ville" aria-label="Ville" autocomplete="off"><button>OK</button></form>
      <div class="cond" id="mCond">chargement…</div>
      <div class="cond" id="mMinMax"></div>
    </div>
  </section>

  <!-- HUMEUR -->
  <section class="card humeur">
    <h3>
      <svg class="ico" style="width:16px;height:16px" viewBox="0 0 24 24"><path d="M4 20c4-2 6-6 8-12 2 6 4 10 8 12"/></svg>
      Mon humeur du jour
    </h3>
    <div class="faces" id="faces"></div>
  </section>

  <!-- SPOTIFY -->
  <section class="card spot" id="spot"></section>

  <!-- PHOTO -->
  <section class="card photo" role="img" aria-label="Disque vinyle et note : la vie est belle"></section>
</div>

<script>
/* ---------- utilitaires stockage (sécurisé) ---------- */
const store={
  get(k){try{return localStorage.getItem(k)}catch(e){return null}},
  set(k,v){try{localStorage.setItem(k,v)}catch(e){}}
};

/* ---------- DATE (modifiable) ---------- */
const iso=d=>{const z=new Date(d.getTime()-d.getTimezoneOffset()*60000);return z.toISOString().slice(0,10)};
let current=iso(new Date());
const onDateChange=[];
function setDate(v){
  current=v||iso(new Date());
  const d=new Date(current+'T12:00:00');
  const s=d.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  document.getElementById('date').textContent=s.charAt(0).toUpperCase()+s.slice(1);
  document.getElementById('dpick').value=current;
  document.getElementById('today').hidden=(current===iso(new Date()));
  onDateChange.forEach(f=>f());
}
document.getElementById('dpick').addEventListener('change',e=>setDate(e.target.value));
document.getElementById('today').addEventListener('click',()=>setDate(''));

/* ---------- MÉTÉO : ville modifiable, suit la date affichée (Open-Meteo, sans clé) ---------- */
(function(){
  const codes={0:['☀️','Ensoleillé'],1:['🌤️','Peu nuageux'],2:['⛅','Nuageux'],3:['☁️','Couvert'],
    45:['🌫️','Brouillard'],48:['🌫️','Brouillard'],51:['🌦️','Bruine'],53:['🌦️','Bruine'],55:['🌦️','Bruine'],
    61:['🌧️','Pluie'],63:['🌧️','Pluie'],65:['🌧️','Forte pluie'],66:['🌧️','Pluie verglaçante'],67:['🌧️','Pluie verglaçante'],
    71:['🌨️','Neige'],73:['🌨️','Neige'],75:['🌨️','Forte neige'],77:['🌨️','Grésil'],
    80:['🌦️','Averses'],81:['🌦️','Averses'],82:['⛈️','Fortes averses'],85:['🌨️','Averses de neige'],86:['🌨️','Averses de neige'],
    95:['⛈️','Orage'],96:['⛈️','Orage'],99:['⛈️','Orage']};
  let place={name:'Toulouse',lat:43.6047,lon:1.4442};
  try{const sv=JSON.parse(store.get('lp-ville')||'null'); if(sv&&sv.lat) place=sv}catch(e){}
  const $=id=>document.getElementById(id);
  const todayIso=()=>iso(new Date());
  let seq=0;
  function load(){
    const my=++seq; $('ville').textContent=place.name;
    $('mCond').textContent='chargement…'; $('mMinMax').textContent='';
    const day=current, isToday=(day===todayIso());
    const url='https://api.open-meteo.com/v1/forecast?latitude='+place.lat+'&longitude='+place.lon
      +'&current=temperature_2m,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min'
      +'&timezone=auto&past_days=92&forecast_days=16';
    fetch(url).then(r=>r.json()).then(j=>{
      if(my!==seq) return;
      let code,temp,mn,mx;
      if(isToday&&j.current){code=j.current.weather_code;temp=j.current.temperature_2m;}
      const i=(j.daily&&j.daily.time)?j.daily.time.indexOf(day):-1;
      if(i>=0){mx=j.daily.temperature_2m_max[i];mn=j.daily.temperature_2m_min[i];
        if(code===undefined){code=j.daily.weather_code[i];temp=mx;}}
      if(code===undefined){
        $('mTemp').textContent='–°';$('mEmoji').textContent='🌤️';
        $('mCond').textContent='pas de météo pour cette date';return;}
      const w=codes[code]||['🌤️','—'];
      $('mTemp').textContent=Math.round(temp)+'°';
      $('mEmoji').textContent=w[0]; $('mCond').textContent=w[1];
      $('mMinMax').textContent=(mn!==undefined)?('min '+Math.round(mn)+'° · max '+Math.round(mx)+'°'):'';
    }).catch(()=>{if(my===seq)$('mCond').textContent='météo indisponible'});
  }
  $('ville').onclick=()=>{$('ville').hidden=true;$('vform').hidden=false;$('vin').value='';$('vin').focus()};
  $('vform').onsubmit=e=>{
    e.preventDefault(); const q=$('vin').value.trim();
    if(!q){$('vform').hidden=true;$('ville').hidden=false;return}
    fetch('https://geocoding-api.open-meteo.com/v1/search?count=1&language=fr&name='+encodeURIComponent(q))
      .then(r=>r.json()).then(j=>{
        if(j.results&&j.results[0]){
          const r=j.results[0]; place={name:r.name,lat:r.latitude,lon:r.longitude};
          store.set('lp-ville',JSON.stringify(place));
          $('vform').hidden=true;$('ville').hidden=false;load();
        }else{$('vin').style.borderColor='#a33'}
      }).catch(()=>{$('vin').style.borderColor='#a33'});
  };
  onDateChange.push(load);
})();

/* ---------- HUMEUR (clic, mémorisée pour la date affichée) ---------- */
(function(){
  const moods=[
    {k:'Calme',     mouth:'M11 23c2 1.4 4 1.4 6 0'},
    {k:'Motivée',   mouth:'M10.5 21.5c2 2.6 5 2.6 7 0'},
    {k:'Fatiguée',  mouth:'M10.5 24c2-1.6 5-1.6 7 0'},
    {k:'Heureuse',  mouth:'M10 21.5c2.2 3 5.8 3 8 0'},
    {k:'Stressée',  mouth:'M10.5 23.5h7'}
  ];
  const wrap=document.getElementById('faces');
  const btns=moods.map(m=>{
    const b=document.createElement('button');
    b.className='face'; b.type='button'; b.setAttribute('aria-label',m.k);
    b.innerHTML=`<svg viewBox="0 0 28 28"><circle cx="14" cy="14" r="11.5"/>
      <circle class="e" cx="10" cy="11.5" r=".9"/><circle class="e" cx="18" cy="11.5" r=".9"/>
      <path class="m" d="${m.mouth}" transform="translate(0,-4)"/></svg><span>${m.k}</span>`;
    b.onclick=()=>{
      const key='lp-humeur-'+current, was=store.get(key);
      store.set(key, was===m.k?'':m.k);   /* re-toucher = désélectionner */
      refresh();
    };
    wrap.appendChild(b); return b;
  });
  function refresh(){
    const sel=store.get('lp-humeur-'+current);
    btns.forEach((b,i)=>b.classList.toggle('on',sel===moods[i].k));
  }
  onDateChange.push(refresh);
})();

/* ---------- SPOTIFY : colle un lien de playlist, le lecteur apparaît ---------- */
(function(){
  const box=document.getElementById('spot');
  function toEmbed(u){
    try{
      const x=new URL(u.trim());
      if(!/spotify\.com$/.test(x.hostname)) return null;
      const p=x.pathname.replace(/^\/(intl-[a-z]+\/)?/,'').split('/');
      if(!['playlist','album','track','artist','show','episode'].includes(p[0])||!p[1]) return null;
      return `https://open.spotify.com/embed/${p[0]}/${p[1]}?theme=0`;
    }catch(e){return null}
  }
  function form(){
    box.className='card spot';
    box.innerHTML=`<div class="logo"><svg viewBox="0 0 24 24"><path d="M5 9c5-1.5 10-1 14 1.5M6 13c4-1 8-.7 11 1.2M7 17c3-.7 6-.4 8.5 1"/></svg></div>
      <div class="txt"><div class="t">Spotify</div><div class="sub">Good vibes only</div>
      <form><input placeholder="Colle le lien de ta playlist" aria-label="Lien Spotify"><button>OK</button></form></div>`;
    box.querySelector('form').onsubmit=e=>{
      e.preventDefault();
      const emb=toEmbed(box.querySelector('input').value);
      if(!emb){box.querySelector('input').style.borderColor='#a33';return}
      store.set('lp-spotify',emb); player(emb);
    };
  }
  function player(emb){
    box.className='card spot has';
    box.innerHTML=`<iframe class="player" src="${emb}" allow="encrypted-media" loading="lazy"></iframe>
      <button class="chg">changer de playlist</button>`;
    box.querySelector('.chg').onclick=()=>{store.set('lp-spotify','');form()};
  }
  const s=store.get('lp-spotify'); s?player(s):form();
})();
setDate('');
</script>
